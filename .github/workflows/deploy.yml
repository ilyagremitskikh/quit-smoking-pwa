name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: github.event_name == 'push'
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
      - name: Trigger deploy webhook
        if: github.event_name == 'push' && secrets.DEPLOY_WEBHOOK_URL != ''
        run: |
          curl -fsS -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "X-QuitKit-Signature: sha256=$(echo -n deploy | openssl dgst -sha256 -hmac '${{ secrets.DEPLOY_SECRET }}' | awk '{print $2}')" \
            -d deploy
